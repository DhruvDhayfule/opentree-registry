<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Label Generator | OpenTree Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --accent-mint: #d8f3dc;
            --accent-sage: #b7e4c7;
            --primary-green: #2d6a4f;
            --text-dark: #1b4332;
            --text-muted: #52b788;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #2d3748;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .controls-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .controls-card h1 {
            color: var(--text-dark);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .controls-card p {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
            flex-wrap: wrap;
        }

        .url-input {
            flex: 1;
            min-width: 280px;
            padding: 0.85rem 1.25rem;
            border: 2px solid #cbd5e0;
            border-radius: 50px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .url-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: white;
        }

        .btn-secondary {
            background-color: var(--accent-sage);
            color: var(--text-dark);
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .qr-card {
            background: white;
            border: 2px dashed var(--accent-sage);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow);
            page-break-inside: avoid;
        }

        .badge-id {
            background: var(--accent-mint);
            color: var(--primary-green);
            padding: 0.25rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tree-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.2rem;
        }

        .tree-sci {
            font-size: 0.85rem;
            font-style: italic;
            color: #40916c;
            margin-bottom: 1rem;
        }

        .qr-card img {
            width: 160px;
            height: 160px;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #edf2f7;
            padding: 6px;
            background: #fff;
        }

        .scan-hint {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        /* Print Optimization */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .controls-card, footer {
                display: none;
            }

            .qr-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }

            .qr-card {
                box-shadow: none;
                border: 1px dashed #cbd5e0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls-card">
            <h1>OpenTree QR Label Generator</h1>
            <p>Enter your GitHub Pages URL to instantly generate printable QR labels for all registered trees.</p>
            
            <div class="input-group">
                <input type="text" id="baseUrlInput" class="url-input" placeholder="https://yourusername.github.io/opentree-registry">
                <button class="btn btn-primary" onclick="generateQRCodes()">Generate QRs</button>
                <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Labels</button>
            </div>
        </div>

        <div class="qr-grid" id="qrContainer">
            <!-- QR cards rendered here -->
        </div>

        <footer>
            OpenTree Registry • Conceptualized & Developed by Dhruv Dhayfule, Rudra Nishad & Daksh Raj
        </footer>
    </div>

    <script>
        const trees = [
            { id: "TREE-01", commonName: "Sago Palm", scientificName: "Cycas revoluta" },
            { id: "TREE-02", commonName: "Kerai Payung", scientificName: "Filicium decipiens" },
            { id: "TREE-03", commonName: "Vasaka", scientificName: "Justicia adhatoda" },
            { id: "TREE-04", commonName: "White Orchid Tree", scientificName: "Bauhinia acuminata" },
            { id: "TREE-05", commonName: "Beach Spider Lily", scientificName: "Hymenocallis littoralis" },
            { id: "TREE-06", commonName: "Firebush", scientificName: "Hamelia patens" },
            { id: "TREE-07", commonName: "Brazilian Firetree", scientificName: "Schizolobium parahyba" },
            { id: "TREE-08", commonName: "Banyan Tree", scientificName: "Ficus benghalensis" },
            { id: "TREE-09", commonName: "Parakeet Flower", scientificName: "Heliconia psittacorum" }
        ];

        function generateQRCodes() {
            let baseUrl = document.getElementById('baseUrlInput').value.trim();
            
            if (!baseUrl) {
                alert("Please enter your GitHub Pages website URL!");
                return;
            }

            // Remove trailing slashes or index.html if present
            baseUrl = baseUrl.replace(/\/+$/, '').replace(/\/index\.html$/, '');

            const container = document.getElementById('qrContainer');
            container.innerHTML = '';

            trees.forEach(tree => {
                const targetUrl = `${baseUrl}/tree.html?id=${tree.id}`;
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(targetUrl)}`;

                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `
                    <span class="badge-id">${tree.id}</span>
                    <div class="tree-name">${tree.commonName}</div>
                    <div class="tree-sci">${tree.scientificName}</div>
                    <img src="${qrApiUrl}" alt="QR Code for ${tree.commonName}">
                    <span class="scan-hint">Scan to view profile</span>
                `;
                container.appendChild(card);
            });
        }

        // Pre-fill URL if hosted live
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
                const currentOrigin = window.location.origin + window.location.pathname.replace(/\/qrcodes\.html$/, '');
                document.getElementById('baseUrlInput').value = currentOrigin;
                generateQRCodes();
            }
        });
    </script>
</body>
</html>
