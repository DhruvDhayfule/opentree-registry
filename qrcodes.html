<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Label Generator | OpenTree Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #e8f5e9 0%, #d8f3dc 40%, #c7f9cc 100%);
      --card-bg: #ffffff;
      --accent: #1b4332;
      --accent-bright: #52b788;
      --text-main: #0b2b1a;
      --text-muted: #2d6a4f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .generator-card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px -10px rgba(45, 106, 79, 0.2);
      text-align: center;
      max-width: 440px;
      width: 100%;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    select {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      border-radius: 12px;
      border: 2px solid #b7e4c7;
      margin-bottom: 1.2rem;
      font-family: inherit;
      outline: none;
      background-color: #f8fbf9;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    select:focus {
      border-color: var(--accent-bright);
    }

    .qr-frame {
      background: #f8fbf9;
      border: 2px dashed #b7e4c7;
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      min-height: 250px;
    }

    #qrcode img {
      margin: 0 auto;
      border-radius: 8px;
    }

    .plant-label {
      margin-top: 0.8rem;
      font-weight: 800;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.5rem;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-bright);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .btn-secondary:hover {
      background: rgba(27, 67, 50, 0.05);
    }

    @media print {
      body { background: #ffffff; padding: 0; }
      .generator-card { box-shadow: none; border: none; padding: 0; max-width: 100%; }
      h1, p.subtitle, label, select, .btn-group { display: none; }
      .qr-frame { border: none; padding: 0; background: transparent; }
    }
  </style>
</head>
<body>

  <div class="generator-card">
    <h1>🌱 QR Label Generator</h1>
    <p class="subtitle">Generate print-ready physical tree tags</p>

    <label for="plantSelect">Select Campus Plant</label>
    <select id="plantSelect" onchange="generateQR()">
      <option value="sago-palm">Sago Palm (Cycas revoluta)</option>
      <option value="kerai-payung">Kerai Payung (Filicium decipiens)</option>
      <option value="vasaka">Vasaka (Justicia adhatoda)</option>
      <option value="white-orchid-tree">White Orchid Tree (Bauhinia variegata)</option>
      <option value="beach-spider-lily">Beach Spider Lily (Hymenocallis littoralis)</option>
      <option value="firebush">Firebush (Hamelia patens)</option>
      <option value="brazilian-firetree">Brazilian Firetree (Schizolobium parahyba)</option>
      <option value="banyan-tree">Banyan Tree (Ficus benghalensis)</option>
      <option value="parakeet-flower">Parakeet Flower (Heliconia psittacorum)</option>
    </select>

    <div class="qr-frame">
      <div id="qrcode"></div>
      <div id="plantLabel" class="plant-label"></div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="window.print()">🖨️ Print QR Label</button>
      <a href="index.html" class="btn btn-secondary">&larr; Return to Registry</a>
    </div>
  </div>

  <script>
    const qrContainer = document.getElementById("qrcode");

    function generateQR() {
      const select = document.getElementById("plantSelect");
      const plantId = select.value;
      const plantName = select.options[select.selectedIndex].text.split(' (')[0];

      qrContainer.innerHTML = "";

      // Dynamic path builder: adapts whether tested locally or deployed live on GitHub Pages
      let targetURL = "";
      if (window.location.protocol === "file:") {
        targetURL = `https://dhruvdhayfule.github.io/opentree-registry/tree.html?id=${plantId}`;
      } else {
        const baseURL = window.location.origin + window.location.pathname.replace('qr.html', 'tree.html');
        targetURL = `${baseURL}?id=${plantId}`;
      }

      new QRCode(qrContainer, {
        text: targetURL,
        width: 190,
        height: 190,
        colorDark: "#1b4332",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("plantLabel").innerText = plantName;
    }

    // Auto-render default plant when opening page
    window.onload = generateQR;
  </script>
</body>
</html>
