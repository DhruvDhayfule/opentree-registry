<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Profile | OpenTree Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f7f4;
            --card-bg: #ffffff;
            --primary-green: #2d6a4f;
            --dark-green: #1b4332;
            --accent-mint: #d8f3dc;
            --accent-sage: #b7e4c7;
            --text-dark: #1b4332;
            --text-muted: #52796f;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #2d3748;
            padding-bottom: 3rem;
            line-height: 1.6;
        }

        .header-bar {
            background: var(--dark-green);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            color: var(--accent-mint);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .container {
            max-width: 850px;
            margin: 2rem auto 0;
            padding: 0 1.25rem;
        }

        .hero-card {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--primary-green) 100%);
            color: white;
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .tree-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.25rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .common-name {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .botanical-name {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--accent-mint);
        }

        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0,0,0,0.03);
            text-align: center;
        }

        .tree-photo {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: calc(var(--radius) - 4px);
            display: block;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--accent-mint);
            padding-bottom: 0.4rem;
        }

        .taxonomy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .tax-item {
            background: var(--bg-main);
            padding: 0.75rem;
            border-radius: 12px;
            text-align: center;
        }

        .tax-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        .tax-val {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-top: 0.2rem;
        }

        .tax-val.italic { font-style: italic; }

        ul.info-list { list-style-type: none; }
        ul.info-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
            color: #4a5568;
        }
        ul.info-list li::before {
            content: "•";
            color: var(--primary-green);
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0.4rem;
            top: -0.1rem;
        }

        .school-card {
            background: var(--accent-mint);
            border-left: 5px solid var(--primary-green);
        }

        .school-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .school-item strong {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .school-item span {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">← Back to Catalog</a>
        <span style="font-size: 0.85rem; opacity: 0.8;">OpenTree Registry</span>
    </div>

    <div class="container" id="profileContainer"></div>

    <footer>OpenTree Registry • Campus Botanical Directory</footer>

    <script>

                benefits: ["Popular ornamental landscape plant worldwide", "Starch extracted from trunk processed traditionally as sago"],

                benefits: ["Provides exceptional urban shade and cooling", "Frequently planted along avenues for aesthetic enhancement"],

                facts: ["Leaves act as a natural pesticide due to bitter alkaloid contents.", "Reverence in traditional medicine spans over 2,000 years."],
                schoolDetails: { schoolName: "Lodha World School LSG", clubName: "EcoClub / Nature Club", treeId: "TREE-03", plantationDate: "October 2022" }
            },
            "TREE-04": {
                commonName: "White Orchid Tree",
                botanicalName: "Bauhinia acuminata",
                image: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=800&q=80",

                taxonomy: { kingdom: "Plantae", division: "Tracheophyta", class: "Magnoliopsida", order: "Gentianales", family: "Rubiaceae", genus: "Hamelia", species: "patens" },
                description: "A fast-growing evergreen shrub known for its bright reddish-orange tubular flowers and shiny foliage.",

                image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80",

            },
            "TREE-09": {
                commonName: "Parakeet Flower / Heliconia",
                botanicalName: "Heliconia psittacorum",
                image: "https://images.unsplash.com/photo-1533038590840-1cde6e668a91?auto=format&fit=crop&w=800&q=80",
                taxonomy: { kingdom: "Plantae", division: "Tracheophyta", class: "Liliopsida", order: "Zingiberales", family: "Heliconiaceae", genus: "Heliconia", species: "psittacorum" },
                description: "A tropical perennial featuring paddle-like foliage and long-lasting bright orange-yellow flower bracts.",
                benefits: ["Popular cut flower for decorative floral arrangements", "Excellent landscape border plant"],
                ecologicalImportance: "Crucial nectar provider for specialized long-billed hummingbirds.",
                season: "Blooms continuously in warm humid conditions.",

        const defaultTree = treeData["TREE-01"];

        function renderProfile() {
            const params = new URLSearchParams(window.location.search);
            const treeId = params.get('id');
            const data = treeData[treeId] || defaultTree;

            const container = document.getElementById('profileContainer');
            container.innerHTML = `
                <div class="hero-card">
                    <span class="tree-badge">${data.schoolDetails.treeId}</span>
                    <h1 class="common-name">${data.commonName}</h1>
                    <div class="botanical-name">${data.botanicalName}</div>
                </div>

                <div class="image-card">
                    <img src="${data.image}" alt="${data.commonName}" class="tree-photo" onerror="this.src='https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=800&q=80';">
                </div>

                <div class="section-card">
                    <div class="section-title">🏛️ Taxonomic Classification</div>
                    <div class="taxonomy-grid">
                        <div class="tax-item"><div class="tax-label">Kingdom</div><div class="tax-val">${data.taxonomy.kingdom}</div></div>
                        <div class="tax-item"><div class="tax-label">Division</div><div class="tax-val">${data.taxonomy.division}</div></div>
                        <div class="tax-item"><div class="tax-label">Class</div><div class="tax-val">${data.taxonomy.class}</div></div>
                        <div class="tax-item"><div class="tax-label">Order</div><div class="tax-val">${data.taxonomy.order}</div></div>
                        <div class="tax-item"><div class="tax-label">Family</div><div class="tax-val">${data.taxonomy.family}</div></div>
                        <div class="tax-item"><div class="tax-label">Genus</div><div class="tax-val italic">${data.taxonomy.genus}</div></div>
                        <div class="tax-item"><div class="tax-label">Species</div><div class="tax-val italic">${data.taxonomy.species}</div></div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title">📖 About the Tree</div>
                    <p>${data.description}</p>
                </div>

                <div class="section-card">
                    <div class="section-title">💡 Benefits & Uses</div>
                    <ul class="info-list">${data.benefits.map(b => `<li>${b}</li>`).join('')}</ul>
                </div>

                <div class="section-card">
                    <div class="section-title">🌍 Ecological Importance</div>
                    <p>${data.ecologicalImportance}</p>
                </div>

                <div class="section-card">
                    <div class="section-title">🌸 Flowering & Fruiting Season</div>
                    <p>${data.season}</p>
                </div>

                <div class="section-card">
                    <div class="section-title">✨ Interesting Facts</div>
                    <ul class="info-list">${data.facts.map(f => `<li>${f}</li>`).join('')}</ul>
                </div>

                <div class="section-card school-card">
                    <div class="section-title" style="border-bottom-color: var(--primary-green);">🏫 School Details</div>
                    <div class="school-grid">
                        <div class="school-item"><strong>School Name</strong><span>${data.schoolDetails.schoolName}</span></div>
                        <div class="school-item"><strong>Eco Club / Nature Club</strong><span>${data.schoolDetails.clubName}</span></div>
                        <div class="school-item"><strong>Tree ID</strong><span>${data.schoolDetails.treeId}</span></div>
                        <div class="school-item"><strong>Date of Plantation</strong><span>${data.schoolDetails.plantationDate}</span></div>
                    </div>
                </div>
            `;
        }

        renderProfile();
    </script>
</body>
</html>
