<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Details | OpenTree Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #e8f5e9 0%, #d8f3dc 40%, #c7f9cc 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-main: #0b2b1a;
      --text-muted: #2d6a4f;
      --accent: #1b4332;
      --accent-bright: #52b788;
      --chip-bg: rgba(216, 243, 220, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 780px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px -10px rgba(45, 106, 79, 0.2);
      overflow: hidden;
    }
    .btn-back {
      display: inline-block;
      margin: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 30px;
      transition: background 0.2s ease;
    }
    .btn-back:hover { background: var(--accent-bright); }
    .hero-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      background-color: #d8f3dc;
      display: block;
    }
    .details-body { padding: 2rem; }
    h1 { color: var(--accent); font-size: 2.3rem; margin-bottom: 0.2rem; }
    .scientific { font-size: 1.15rem; font-style: italic; color: var(--text-muted); margin-bottom: 1.5rem; font-weight: 600; }
    
    /* Specs Grid */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.8rem;
    }
    .spec-card {
      background: var(--chip-bg);
      padding: 0.8rem 1rem;
      border-radius: 14px;
      border: 1px solid rgba(82, 183, 136, 0.3);
    }
    .spec-card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .spec-card span {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .description { font-size: 1.05rem; line-height: 1.8; margin-bottom: 1.5rem; }
    
    /* Callout Box for Botanical Facts */
    .fact-box {
      background: rgba(82, 183, 136, 0.15);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--accent);
    }
    .fact-box strong { font-weight: 800; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-back">&larr; Back to Registry</a>
    <img id="plantImage" class="hero-img" src="" alt="Plant Image">
    
    <div class="details-body">
      <h1 id="plantName">Loading...</h1>
      <div id="plantScientific" class="scientific"></div>

      <!-- Extended Botanical Metadata -->
      <div class="specs-grid">
        <div class="spec-card">
          <label>Family</label>
          <span id="plantFamily">-</span>
        </div>
        <div class="spec-card">
          <label>Native Region</label>
          <span id="plantOrigin">-</span>
        </div>
        <div class="spec-card">
          <label>Plant Type</label>
          <span id="plantType">-</span>
        </div>
        <div class="spec-card">
          <label>Ecological Role</label>
          <span id="plantRole">-</span>
        </div>
      </div>

      <p id="plantDescription" class="description"></p>

      <div class="fact-box">
        <strong>💡 Botanical Note:</strong> <span id="plantFact">Loading fact...</span>
      </div>
    </div>
  </div>

  <script>
    const plantData = {
      "sago-palm": {
        name: "Sago Palm",
        scientificName: "Cycas revoluta",
        family: "Cycadaceae",
        origin: "Southern Japan",
        type: "Gymnosperm (Cycad)",
        role: "Ornamental Evergreen",
        image: "images/sago-palm.jpg",
        description: "A slow-growing cycad with stiff, feather-like dark green fronds arranged in a symmetrical rosette. Despite its common name, it is a gymnosperm rather than a true palm tree.",
        fact: "Cycads are botanical 'living fossils' that have existed on Earth for over 280 million years, pre-dating the age of dinosaurs."
      },
      "kerai-payung": {
        name: "Kerai Payung",
        scientificName: "Filicium decipiens",
        family: "Sapindaceae",
        origin: "East Africa & South Asia",
        type: "Evergreen Shade Tree",
        role: "Canopy & Urban Cooling",
        image: "images/ferntree.jpg",
        description: "Widely known as the Fern Tree due to its finely divided, glossy, fern-like foliage. It produces a compact, symmetrical umbrella canopy that makes it ideal for landscape shade.",
        fact: "Its dense umbrella-shaped canopy acts as a natural air cooler in tropical urban landscapes by significantly reducing ground surface heat."
      },
      "vasaka": {
        name: "Vasaka",
        scientificName: "Justicia adhatoda",
        family: "Acanthaceae",
        origin: "Indian Subcontinent",
        type: "Medicinal Shrub",
        role: "Pollinator Habitat & Herbal",
        image: "images/malabar-nut.jpg",
        description: "An evergreen medicinal shrub with broad lance-shaped leaves and dense white flower spikes featuring subtle purple throat markings.",
        fact: "Contains the alkaloid vasicine, which has been utilized in Ayurvedic respiratory treatments for thousands of years to support bronchial health."
      },
      "white-orchid-tree": {
        name: "White Orchid Tree",
        scientificName: "Bauhinia variegata var. candida",
        family: "Fabaceae",
        origin: "South & Southeast Asia",
        type: "Deciduous Flowering Tree",
        role: "Nitrogen Fixer & Pollinator Attractant",
        image: "images/white-orchard-tree.jpg",
        description: "A small to medium-sized tree producing fragrant, showy white blossoms resembling delicate orchids alongside distinctive two-lobed 'camel's foot' leaves.",
        fact: "As a member of the legume family, its root system collaborates with soil bacteria to convert atmospheric nitrogen into nutrients, naturally enriching the soil."
      },
      "beach-spider-lily": {
        name: "Beach Spider Lily",
        scientificName: "Hymenocallis littoralis",
        family: "Amaryllidaceae",
        origin: "Tropical Americas",
        type: "Perennial Bulb",
        role: "Coastal Ground Cover",
        image: "images/beach-spider-lily.jpg",
        description: "A resilient perennial plant with long, strap-like leaves and fragrant white flowers featuring six slender spider-like petals extending from a central cup.",
        fact: "Extremely tolerant to high salinity and coastal wind conditions, making it an excellent natural stabilizer for sandy soils."
      },
      "firebush": {
        name: "Firebush",
        scientificName: "Hamelia patens",
        family: "Rubiaceae",
        origin: "Subtropical Americas",
        type: "Flowering Evergreen Shrub",
        role: "Hummingbird & Butterfly Magnet",
        image: "images/firebush.webp",
        description: "A fast-growing, heat-tolerant shrub bearing clusters of bright red-orange tubular flowers followed by small dark berries.",
        fact: "One of the most effective pollinator plants in warm climates—its nectar blooms continuously to feed hummingbirds, bees, and butterflies."
      },
      "brazilian-firetree": {
        name: "Brazilian Firetree",
        scientificName: "Schizolobium parahyba",
        family: "Fabaceae",
        origin: "Central & South America",
        type: "Fast-Growing Canopy Tree",
        role: "Reforestation Canopy",
        image: "images/brazillian-firetree.jpg",
        description: "A towering tree famous for its incredibly rapid growth rate, giant fern-like fronds, and spectacular golden-yellow flower displays during spring.",
        fact: "Can grow over 3 meters (10 feet) per year in optimal conditions, making it a valuable target species for fast-track tropical ecological restoration."
      },
      "banyan-tree": {
        name: "Banyan Tree",
        scientificName: "Ficus benghalensis",
        family: "Moraceae",
        origin: "Indian Subcontinent",
        type: "Epiphytic Evergreen Tree",
        role: "Keystone Ecosystem Hub",
        image: "images/banyan-tree.jpg",
        description: "A iconic fig tree that grows prop roots downward from its branches, eventually creating sturdy thick trunks that allow a single tree to spread over vast areas.",
        fact: "Serves as a vital keystone species in ecosystems, offering shelter and nutrition to hundreds of bird, bat, insect, and mammal species."
      },
      "parakeet-flower": {
        name: "Parakeet Flower",
        scientificName: "Heliconia psittacorum",
        family: "Heliconiaceae",
        origin: "Caribbean & South America",
        type: "Tropical Perennial Herb",
        role: "Micro-habitat Provider",
        image: "images/parakeet-flower.jpg",
        description: "A tropical herb featuring glossy banana-like leaves and upright floral bracts in brilliant shades of yellow, orange, and red resembling colorful bird plumage.",
        fact: "The cup-like bracts hold small reservoirs of rainwater that create micro-habitats for tiny beneficial organisms and insects."
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let plantId = urlParams.get('id');

    // Default fallback to Sago Palm if launched without URL params
    if (!plantId || !plantData[plantId]) {
      plantId = 'sago-palm';
    }

    const item = plantData[plantId];
    document.getElementById('plantName').textContent = item.name;
    document.getElementById('plantScientific').textContent = item.scientificName;
    document.getElementById('plantFamily').textContent = item.family;
    document.getElementById('plantOrigin').textContent = item.origin;
    document.getElementById('plantType').textContent = item.type;
    document.getElementById('plantRole').textContent = item.role;
    document.getElementById('plantDescription').textContent = item.description;
    document.getElementById('plantFact').textContent = item.fact;
    
    document.getElementById('plantImage').src = item.image;
    document.getElementById('plantImage').alt = item.name;
  </script>
</body>
</html>
