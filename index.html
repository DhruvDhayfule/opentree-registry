<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTree Registry | EcoClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --accent-mint: #d8f3dc;
            --accent-sage: #b7e4c7;
            --accent-blush: #ffe5ec;
            --accent-lavender: #e8e8e4;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --primary-green: #40916c;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 2.5rem 1.5rem;
            background: linear-gradient(135deg, #e8f5e9 0%, #f3e5f5 100%);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background-color: var(--card-bg);
            color: var(--primary-green);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 50px;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #1b4332;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 1rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background-color: var(--card-bg);
        }

        .search-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(64, 145, 108, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #edf2f7;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.08);
        }

        .card-img-placeholder {
            height: 200px;
            background-color: var(--accent-mint);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-green);
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
        }

        .tree-id {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-green);
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .common-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .sci-name {
            font-style: italic;
            color: var(--primary-green);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .tag-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: var(--accent-blush);
            color: #9b2c2c;
            font-weight: 600;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .benefits {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px dashed #e2e8f0;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .benefits strong {
            color: var(--primary-green);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer strong {
            color: var(--primary-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="badge">EcoClub Registry • 09/07/2026</span>
            <h1>OpenTree Registry</h1>
            <p>Digital catalog of campus flora showcasing ecological importance, species details, and identification records.</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by common or scientific name...">
        </div>

        <div class="grid" id="treeGrid">
            <!-- Dynamic tree cards rendered here -->
        </div>

        <footer>
            <p><strong>OpenTree Registry</strong> — Conceptualized & Developed by <strong>Dhruv Dhayfule</strong>, <strong>Rudra Nishad</strong> & <strong>Daksh Raj</strong></p>
        </footer>
    </div>

    <script>
        const trees = [
            {
                id: "TREE-01",
                commonName: "Sago Palm",
                scientificName: "Cycas revoluta",
                category: "Gymnosperm / Cycad",
                description: "An ancient, slow-growing plant with feathery evergreen leaves arranged in a rosette. Often used as an ornamental centerpiece.",
                benefits: "Air purification, ornamental garden aesthetics, evolutionary study icon."
            },
            {
                id: "TREE-02",
                commonName: "Kerai Payung / Fern Tree",
                scientificName: "Filicium decipiens",
                category: "Evergreen Canopy Tree",
                description: "Recognized by its dense foliage resembling fern leaves. Provides dense shade and grows into a symmetric dome.",
                benefits: "Urban heat reduction, shade canopy, ornamental street landscaping."
            },
            {
                id: "TREE-03",
                commonName: "Vasaka / Malabar Nut",
                scientificName: "Justicia adhatoda",
                category: "Medicinal Shrub",
                description: "A medicinal shrub with broad, lance-shaped leaves and white tubular flowers. Known for extensive use in traditional healthcare.",
                benefits: "Respiratory wellness, pollinator habitat, soil stabilization."
            },
            {
                id: "TREE-04",
                commonName: "White Orchid Tree",
                scientificName: "Bauhinia acuminata",
                category: "Flowering Shrub",
                description: "Features distinct twin-lobed leaves resembling butterfly wings and fragrant snow-white blossoms.",
                benefits: "Butterfly attractor, nitrogen-fixing soil enrichment, aesthetic landscaping."
            },
            {
                id: "TREE-05",
                commonName: "Beach Spider Lily",
                scientificName: "Hymenocallis littoralis",
                category: "Perennial Herb",
                description: "Perennial plant producing striking spider-like white flowers with long, delicate petals springing from a central cup.",
                benefits: "Soil erosion prevention, low-maintenance green border, fragrance."
            },
            {
                id: "TREE-06",
                commonName: "Firebush",
                scientificName: "Hamelia patens",
                category: "Flowering Shrub",
                description: "Fast-growing shrub with vibrant reddish-orange tubular flowers that bloom continuously in tropical environments.",
                benefits: "Hummingbird and butterfly haven, drought resistance, continuous bloom."
            },
            {
                id: "TREE-07",
                commonName: "Brazilian Firetree",
                scientificName: "Schizolobium parahyba",
                category: "Canopy Tree",
                description: "Renowned for its rapid growth rate, fern-like foliage, and brilliant yellow floral displays in bloom season.",
                benefits: "Rapid reforestation, tall canopy shade, rich organic leaf litter."
            },
            {
                id: "TREE-08",
                commonName: "Banyan Tree",
                scientificName: "Ficus benghalensis",
                category: "Keystone Fig Species",
                description: "A massive tree famous for sending down aerial prop roots that develop into sturdy wooden trunks over time.",
                benefits: "Major biodiversity hub, bird feeding site, massive oxygen production."
            },
            {
                id: "TREE-09",
                commonName: "Parakeet Flower / Heliconia",
                scientificName: "Heliconia psittacorum",
                category: "Tropical Perennial",
                description: "Features glossy banana-like leaves and bright orange to red bracts resembling a parrot's beak.",
                benefits: "Nectar source for pollinators, understory landscaping accent."
            }
        ];

        function renderTrees(filterText = '') {
            const container = document.getElementById('treeGrid');
            container.innerHTML = '';

            const filtered = trees.filter(tree => 
                tree.commonName.toLowerCase().includes(filterText.toLowerCase()) ||
                tree.scientificName.toLowerCase().includes(filterText.toLowerCase()) ||
                tree.category.toLowerCase().includes(filterText.toLowerCase())
            );

            filtered.forEach(tree => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `tree.html?id=${tree.id}`;
                
                card.innerHTML = `
                    <div class="card-img-placeholder">
                        <span class="tree-id">${tree.id}</span>
                        <span>🌿 ${tree.commonName}</span>
                    </div>
                    <div class="card-body">
                        <div class="common-name">${tree.commonName}</div>
                        <div class="sci-name">${tree.scientificName}</div>
                        <div class="tag-container">
                            <span class="tag">${tree.category}</span>
                        </div>
                        <p class="description">${tree.description}</p>
                        <div class="benefits">
                            <strong>Ecological Value:</strong> ${tree.benefits}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTrees(e.target.value);
        });

        // Initial render
        renderTrees();
    </script>
</body>
</html>
